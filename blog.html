        // 記事一覧を表示
        function displayPosts(posts) {
            const blogList = document.getElementById('blog-list');
            blogList.innerHTML = '';

            posts.forEach(post => {
                const article = document.createElement('div');
                article.className = 'bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition-shadow duration-300 blog-post';
                article.setAttribute('data-category', post.category);
                
                article.innerHTML = `
                    <a href="blog/${post.slug}.html" class="flex flex-col md:flex-row gap-4 p-6">
                        <div class="flex-shrink-0 md:w-48">
                            <div class="bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg h-32 md:h-full flex items-center justify-center">
                                <span class="text-4xl">${post.categoryName.split(' ')[0]}</span>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded">
                                    ${post.categoryName}
                                </span>
                                <span class="text-xs text-gray-500">
                                    📅 ${post.date}
                                </span>
                            </div>
                            <h2 class="text-xl font-bold text-gray-900 mb-2 hover:text-blue-600">
                                ${post.title}
                            </h2>
                            <p class="text-sm text-gray-600 mb-3">
                                ${post.excerpt}
                            </p>
                            <span class="inline-flex items-center text-blue-600 font-bold text-sm hover:text-blue-800">
                                続きを読む →
                            </span>
                        </div>
                    </a>
                `;
                
                blogList.appendChild(article);
            });
        }

        // 検索履歴の管理
        const SEARCH_HISTORY_KEY = 'blogSearchHistory';
        const MAX_HISTORY = 10;

        function getSearchHistory() {
            try {
                const history = localStorage.getItem(SEARCH_HISTORY_KEY);
                return history ? JSON.parse(history) : [];
            } catch (e) {
                return [];
            }
        }

        function saveSearchHistory(keyword) {
            if (!keyword || keyword.trim() === '') return;
            
            try {
                let history = getSearchHistory();
                // 重複を削除
                history = history.filter(item => item.keyword !== keyword);
                // 最新のキーワードを先頭に追加
                history.unshift({
                    keyword: keyword,
                    timestamp: new Date().toISOString(),
                    count: 1
                });
                // 最大件数を超えたら古いものを削除
                history = history.slice(0, MAX_HISTORY);
                localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history));
                
                // クリアボタンを表示
                document.getElementById('clearHistoryBtn').style.display = 'inline-block';
            } catch (e) {
                console.error('Failed to save search history:', e);
            }
        }

        function clearSearchHistory() {
            if (confirm('検索履歴をすべて削除しますか？')) {
                localStorage.removeItem(SEARCH_HISTORY_KEY);
                document.getElementById('clearHistoryBtn').style.display = 'none';
                document.getElementById('searchSuggestions').classList.add('hidden');
                alert('検索履歴を削除しました');
            }
        }

        // GTMへの検索イベント送信（デバッグ情報付き）
        function trackSearchEvent(keyword, resultCount) {
            // GTMのdataLayerに送信
            if (window.dataLayer) {
                window.dataLayer.push({
                    event: 'blog_search',
                    search_keyword: keyword,
                    search_result_count: resultCount,
                    search_timestamp: new Date().toISOString(),
                    page_url: window.location.href,
                    page_title: document.title
                });
                console.log('✅ GTMに検索イベント送信:', {
                    keyword: keyword,
                    resultCount: resultCount
                });
            } else {
                console.warn('⚠️ GTMのdataLayerが見つかりません');
            }
            
            // gtagが利用可能な場合は直接GA4にも送信（バックアップ）
            if (typeof gtag === 'function') {
                gtag('event', 'search', {
                    search_term: keyword,
                    search_result_count: resultCount
                });
                console.log('✅ GA4に直接送信（gtagバックアップ）');
            }
        }

        // サジェスト候補の生成
        function generateSuggestions(searchTerm) {
            if (!searchTerm || searchTerm.trim() === '') return [];
            
            const lowerTerm = searchTerm.toLowerCase();
            const suggestions = new Set();
            
            // 記事タイトルから候補を抽出
            blogPosts.forEach(post => {
                const title = post.title.toLowerCase();
                if (title.includes(lowerTerm)) {
                    // タイトルから関連キーワードを抽出
                    const words = post.title.split(/[\s、｜\|（）()]/)
                        .filter(w => w.length >= 2 && w.toLowerCase().includes(lowerTerm));
                    words.forEach(w => suggestions.add(w));
                }
                // カテゴリ名も候補に
                if (post.categoryName.toLowerCase().includes(lowerTerm)) {
                    suggestions.add(post.categoryName);
                }
            });
            
            return Array.from(suggestions).slice(0, 8);
        }

        // サジェスト表示
        function showSearchSuggestions() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.trim();
            const suggestionsDiv = document.getElementById('searchSuggestions');
            
            const history = getSearchHistory();
            const suggestions = generateSuggestions(searchTerm);
            
            let html = '';
            
            // 検索履歴を表示
            if (history.length > 0 && searchTerm === '') {
                html += '<div class="p-4 border-b border-gray-200">';
                html += '<div class="text-xs text-gray-500 mb-2 flex items-center">';
                html += '<i class="fas fa-history mr-2"></i>最近の検索';
                html += '</div>';
                history.forEach(item => {
                    html += `
                        <div class="py-2 px-3 hover:bg-blue-50 cursor-pointer rounded transition-colors flex items-center justify-between group"
                             onclick="selectSuggestion('${item.keyword.replace(/'/g, "\\'")}')"
                        >
                            <span class="text-gray-700">
                                <i class="fas fa-search text-gray-400 mr-2"></i>${item.keyword}
                            </span>
                            <span class="text-xs text-gray-400">${new Date(item.timestamp).toLocaleDateString('ja-JP', {month: 'short', day: 'numeric'})}</span>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // サジェスト候補を表示
            if (suggestions.length > 0 && searchTerm !== '') {
                html += '<div class="p-4">';
                html += '<div class="text-xs text-gray-500 mb-2 flex items-center">';
                html += '<i class="fas fa-lightbulb mr-2"></i>キーワード候補';
                html += '</div>';
                suggestions.forEach(suggestion => {
                    // 検索文字をハイライト
                    const highlighted = suggestion.replace(
                        new RegExp(`(${searchTerm})`, 'gi'),
                        '<span class="bg-yellow-200 font-bold">$1</span>'
                    );
                    html += `
                        <div class="py-2 px-3 hover:bg-blue-50 cursor-pointer rounded transition-colors"
                             onclick="selectSuggestion('${suggestion.replace(/'/g, "\\'")}')"
                        >
                            <i class="fas fa-tag text-blue-400 mr-2"></i>${highlighted}
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            if (html !== '') {
                suggestionsDiv.innerHTML = html;
                suggestionsDiv.classList.remove('hidden');
            } else {
                suggestionsDiv.classList.add('hidden');
            }
        }

        // サジェスト選択時の処理
        function selectSuggestion(keyword) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = keyword;
            document.getElementById('searchSuggestions').classList.add('hidden');
            searchPosts();
        }

        // 検索機能（強化版）
        function searchPosts() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            // サジェストを更新
            showSearchSuggestions();
            
            if (searchTerm === '') {
                // 検索ワードが空の場合は全件表示
                displayPosts(blogPosts);
                document.getElementById('searchResultCount').textContent = `全${blogPosts.length}件の記事`;
                return;
            }
            
            // タイトルとカテゴリ名で検索
            const filtered = blogPosts.filter(post => {
                return post.title.toLowerCase().includes(searchTerm) || 
                       post.categoryName.toLowerCase().includes(searchTerm);
            });
            
            displayPosts(filtered);
            
            // 検索結果件数を表示
            const resultCount = filtered.length;
            if (resultCount === 0) {
                document.getElementById('searchResultCount').innerHTML = 
                    `<span class="text-red-600">「${searchTerm}」の検索結果: 0件</span>`;
            } else {
                document.getElementById('searchResultCount').innerHTML = 
                    `「<span class="text-blue-600">${searchTerm}</span>」の検索結果: <span class="text-blue-600 font-black">${resultCount}件</span>`;
            }
            
            // 検索履歴に保存
            saveSearchHistory(searchTerm);
            
            // GTMにイベント送信
            trackSearchEvent(searchTerm, resultCount);
        }

        // 初期表示
        displayPosts(blogPosts);
        
        // 検索履歴がある場合はクリアボタンを表示
        if (getSearchHistory().length > 0) {
            document.getElementById('clearHistoryBtn').style.display = 'inline-block';
        }
        
        // サジェストドロップダウンの外側クリックで閉じる
        document.addEventListener('click', function(event) {
            const searchInput = document.getElementById('searchInput');
            const suggestionsDiv = document.getElementById('searchSuggestions');
            if (!searchInput.contains(event.target) && !suggestionsDiv.contains(event.target)) {
                suggestionsDiv.classList.add('hidden');
            }
        });
    </script>
