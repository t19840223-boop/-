        // 記事一覧を表示
        function displayPosts(posts) {
            const blogList = document.getElementById('blog-list');
            blogList.innerHTML = '';

            posts.forEach(post => {
                const article = document.createElement('div');
                article.className = 'bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition-shadow duration-300 blog-post';
                article.setAttribute('data-category', post.category);
                
                article.innerHTML = `
                    <a href="blog/${post.slug}.html" class="flex flex-col md:flex-row gap-4 p-6">
                        <div class="flex-shrink-0 md:w-48">
                            <div class="bg-gradient-to-br from-blue-100 to-blue-200 rounded-lg h-32 md:h-full flex items-center justify-center">
                                <span class="text-4xl">${post.categoryName.split(' ')[0]}</span>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded">
                                    ${post.categoryName}
                                </span>
                                <span class="text-xs text-gray-500">
                                    📅 ${post.date}
                                </span>
                            </div>
                            <h2 class="text-xl font-bold text-gray-900 mb-2 hover:text-blue-600">
                                ${post.title}
                            </h2>
                            <p class="text-sm text-gray-600 mb-3">
                                ${post.excerpt}
                            </p>
                            <span class="inline-flex items-center text-blue-600 font-bold text-sm hover:text-blue-800">
                                続きを読む →
                            </span>
                        </div>
                    </a>
                `;
                
                blogList.appendChild(article);
            });
        }

        // カテゴリフィルター
        function filterCategory(category) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            
            event.target.classList.remove('bg-gray-200', 'text-gray-700');
            event.target.classList.add('bg-blue-600', 'text-white');

            if (category === 'all') {
                displayPosts(blogPosts);
            } else {
                const filtered = blogPosts.filter(post => post.category === category);
                displayPosts(filtered);
            }
        }

        // 初期表示
        displayPosts(blogPosts);
    </script>
