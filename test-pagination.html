<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pagination Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">Pagination Test</h1>
    
    <div id="pagination" class="flex gap-2 mb-4"></div>
    
    <div id="cases-container">
        <div class="case-item border p-4 mb-2">Case 1</div>
        <div class="case-item border p-4 mb-2">Case 2</div>
        <div class="case-item border p-4 mb-2">Case 3</div>
        <div class="case-item border p-4 mb-2">Case 4</div>
        <div class="case-item border p-4 mb-2">Case 5</div>
        <div class="case-item border p-4 mb-2">Case 6</div>
        <div class="case-item border p-4 mb-2">Case 7</div>
        <div class="case-item border p-4 mb-2">Case 8</div>
        <div class="case-item border p-4 mb-2">Case 9</div>
        <div class="case-item border p-4 mb-2">Case 10</div>
        <div class="case-item border p-4 mb-2">Case 11</div>
        <div class="case-item border p-4 mb-2">Case 12</div>
    </div>
    
    <script>
        let currentPage = 1;
        const itemsPerPage = 5;
        let allCases = [];
        let totalPages = 1;
        
        function showPage(page) {
            currentPage = page;
            console.log(`Showing page ${page}`);
            
            allCases.forEach(item => item.style.display = 'none');
            
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            
            for (let i = startIndex; i < endIndex && i < allCases.length; i++) {
                allCases[i].style.display = 'block';
                console.log(`  Showing case ${i + 1}: ${allCases[i].textContent}`);
            }
            
            updatePagination();
        }
        
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.onclick = () => showPage(i);
                btn.className = `px-4 py-2 rounded ${i === currentPage ? 'bg-blue-600 text-white' : 'bg-gray-200'}`;
                pagination.appendChild(btn);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            allCases = Array.from(document.querySelectorAll('.case-item'));
            totalPages = Math.ceil(allCases.length / itemsPerPage);
            console.log(`Total cases: ${allCases.length}, Total pages: ${totalPages}`);
            showPage(1);
        });
    </script>
</body>
</html>
